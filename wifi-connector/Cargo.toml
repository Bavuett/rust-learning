[package]
name = "wifi-connector"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

# Binary per l'implementazione NetworkManager
[[bin]]
name = "wifi-connector"
path = "src/main.rs"

# Binary per l'implementazione wpa_supplicant (CLI commands)
[[bin]]
name = "wifi-wpa-supplicant"
path = "src/wpa_supplicant.rs"

# Binary per l'implementazione D-Bus
[[bin]]
name = "wifi-dbus"
path = "src/dbus_impl.rs"

# Binary per l'implementazione Unix Socket
[[bin]]
name = "wifi-socket"
path = "src/socket_impl.rs"
